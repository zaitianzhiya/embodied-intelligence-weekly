# 具身智能 — 评价体系配置

# 五维影响力权重
weights:
  industry_disruption: 30    # 行业颠覆性 — 对具身智能产业格局的重塑程度
  technical_breakthrough: 25 # 技术突破度 — 技术本身的新颖性和难度
  commercialization: 20      # 商业化进展 — 量产/交付/落地/IPO
  ecosystem_impact: 15       # 生态影响力 — 对开发者/供应链/下游的影响
  policy_capital: 10         # 政策资本信号 — 融资/政策/市场预期

# 置信度评分（跨生态独立源交叉验证）
scoring:
  tier_1_weight: 40      # Tier 1 源每个 40 分
  tier_2_weight: 25      # Tier 2 源每个 25 分
  max_score: 100         # 封顶
  min_score_for_A: 80    # A 级 = 2 个 Tier1 生态或等价组合
  min_score_for_B: 60    # B 级 = Tier1 + Tier2 交叉验证
  min_score_for_C: 40    # C 级 = 单一 Tier1 源确认
                          # D 级 = 40 以下

# 质量过滤阈值
filter:
  min_title_length: 10     # 标题最短
  min_desc_length: 30      # 描述最短
  require_citation: true   # 必须有关联源
  max_age_days: 14         # 最多 14 天前


# 六维分类体系
categories:
  - id: "hardware_platform"
    name: "机器人硬件平台"
    label: "#hardware"
    description: "人形机器人/机械臂/灵巧手等硬件本体发布"

  - id: "vla_model"
    name: "VLA 模型与算法"
    label: "#vla-model"
    description: "Vision-Language-Action模型、世界模型、端到端学习"

  - id: "simulation"
    name: "仿真与数据"
    label: "#simulation"
    description: "仿真平台、sim-to-real、数据采集、遥操作"

  - id: "manipulation"
    name: "操作与感知"
    label: "#manipulation"
    description: "灵巧操作、抓取、导航、SLAM、触觉感知"

  - id: "industry"
    name: "产业化与商业"
    label: "#industry"
    description: "量产、交付、融资、IPO、产业链动态"

  - id: "policy"
    name: "政策与监管"
    label: "#policy"
    description: "政府政策、行业标准、安全监管、伦理"

